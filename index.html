<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Git — Mini gestionnaire de tâches</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Suivi des tâches </h1>
    <div><h2>teste de 2eme phase</h2></div>
    <p class="hint">Projet d'essai pour valider la détection des mises à jour distantes.</p>

    <form id="form" class="row" autocomplete="off">
      <input id="input" type="text" placeholder="Nouvelle tâche…" aria-label="Nouvelle tâche" />
      <button type="submit">Ajouter</button>
    </form>

    <ul id="list" class="list"></ul>

    <footer class="footer">
      <span id="count">0 tâche</span>
      <button id="clear" class="ghost" type="button">Tout effacer</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
